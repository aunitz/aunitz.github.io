# Posts relacionados curados a mano
#
# Cada clave es el slug de un post (el nombre del fichero en _posts/ sin la
# fecha) y su valor es la lista ordenada de slugs que se mostrarán en el bloque
# «También te puede interesar».
#
# Los posts que NO aparecen aquí siguen usando la selección automática por
# etiquetas de _includes/related-posts.html. Esto es una capa editorial que se
# superpone al algoritmo, no un sustituto.
#
# Si un slug no existe (por ejemplo tras renombrar un post), se ignora en
# silencio; si no queda ninguno válido, el bloque cae al algoritmo.
#
# ---------------------------------------------------------------------------
# CRITERIOS
#
#   1. Orden por AFINIDAD: primero el post más parecido, no el que da más
#      contexto. Si un artículo explica una ley y otro la aplica, manda el
#      parecido temático y no la jerarquía conceptual.
#   2. Prima la afinidad real sobre la coincidencia de etiquetas: se busca
#      activamente cruzar etiquetas, porque los mejores relacionados a menudo
#      no comparten ninguna.
#   3. La fecha no cuenta. Un post de 2017 puede ser el más relevante.
#
# ALCANCE
#
#   Prioridad 1 — TRÁFICO. Los 40 posts más visitados, que concentran el 91 %
#   de las visitas del blog (GA4, 90 días a 08/08/2026). Es donde una mejora
#   se nota, simplemente porque hay gente leyéndolos.
#
#   Prioridad 2 — ETIQUETA PARAGUAS. Los 32 posts cuyas etiquetas son TODAS
#   paraguas (más de 20 posts cada una). Son los casos donde el algoritmo no
#   tiene con qué desempatar y muestra los más recientes de una lista enorme.
#   Se curaron primero, antes de mirar los datos de tráfico, y se conservan:
#   están bien, pero entre todos suman el 7,9 % de las visitas, así que no
#   conviene seguir ampliando por ahí.
#
#   Más 9 fichas sueltas del piloto de validación.
#
#   Lección aprendida: «donde peor funciona el algoritmo» y «donde más se
#   nota arreglarlo» son ejes distintos. La mediana de los 32 de etiqueta
#   paraguas es de 6 visitas en 90 días; el post más visitado del blog tiene
#   1.115 él solo.
# ---------------------------------------------------------------------------


