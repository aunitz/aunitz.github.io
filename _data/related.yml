# Posts relacionados curados a mano
#
# Cada clave es el slug de un post (el nombre del fichero en _posts/ sin la
# fecha) y su valor es la lista ordenada de slugs que se mostrarán en el bloque
# «También te puede interesar».
#
# Los posts que NO aparecen aquí siguen usando la selección automática por
# etiquetas de _includes/related-posts.html. Esto es una capa editorial que se
# superpone al algoritmo, no un sustituto.
#
# Si un slug no existe (por ejemplo tras renombrar un post), se ignora en
# silencio; si no queda ninguno válido, el bloque cae al algoritmo.
#
# ---------------------------------------------------------------------------
# CRITERIOS
#
#   1. Orden por AFINIDAD: primero el post más parecido, no el que da más
#      contexto. Si un artículo explica una ley y otro la aplica, manda el
#      parecido temático y no la jerarquía conceptual.
#   2. Prima la afinidad real sobre la coincidencia de etiquetas: se busca
#      activamente cruzar etiquetas, porque los mejores relacionados a menudo
#      no comparten ninguna.
#   3. La fecha no cuenta. Un post de 2017 puede ser el más relevante.
#
# ALCANCE
#
#   Se curan los 32 posts cuyas etiquetas son TODAS paraguas (más de 20 posts
#   cada una: «buenas prácticas de usabilidad», 37, y «leyes y principios de
#   UX», 32). Son los casos donde el algoritmo no tiene con qué desempatar y
#   acaba mostrando los más recientes de una lista enorme.
#
#   Se conservan además las 9 fichas del piloto que quedaron fuera de ese
#   grupo, ya revisadas. Si se quiere ceñir la curación estrictamente a las
#   etiquetas paraguas, basta con borrar el último bloque de este fichero.
# ---------------------------------------------------------------------------


# ===========================================================================
# LOS 32 POSTS DE ETIQUETA PARAGUAS
# ===========================================================================

# --- Leyes y efectos de UX --------------------------------------------------

# Su contrapartida directa es la lista canónica de heurísticas de Nielsen.
principios-usabilidad:
  - los-10-principios-generales-usabilidad-jakob-nielsen
  - que-es-la-usabilidad-de-una-aplicacion
  - que-es-un-test-heuristico

# Accot-Zhai es literalmente la extensión de Fitts para trayectorias.
ley-de-fitts:
  - ley-de-direccion-de-accot-zhai
  - tamano-minimo-elementos-interactivos
  - tamano-minimo-elementos-interactivos-dispositivo-tactil

# Más opciones, más tiempo de decisión: el bloqueo por exceso de análisis es
# el mismo fenómeno llevado al extremo.
ley-de-hick:
  - paralisis-por-analisis
  - recomienda-una-opcion
  - ley-de-miller

# La ley de Jakob dice que esperan que tu web funcione como las demás; el
# consejo de usar convenciones es su aplicación literal.
ley-de-jakob:
  - utiliza-convenciones
  - principio-de-experiencia
  - efecto-de-mera-exposicion

# Miller va de cuántos elementos retenemos: agrupar es la técnica que lo
# explota.
ley-de-miller:
  - agrupa-elementos-relacionados
  - efecto-de-posicion-serial
  - ley-de-hick

# Dos leyes de memoria hermanas: qué se recuerda (Von Restorff) y dónde
# estaba (posición serial).
efecto-de-posicion-serial:
  - efecto-von-restorff
  - ley-de-miller
  - utiliza-jerarquia-visual-para-dirigir-la-atencion

# Lo distinto se recuerda: destacar las llamadas a la acción es aplicarlo.
