name: Purge Cloudflare Cache

on:
  deployment_status:

jobs:
  purge-cache:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous successful deployment SHA
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_SHA="${{ github.event.deployment.sha }}"
          echo "Current deploy SHA: $CURRENT_SHA"

          deployments=$(gh api \
            "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=50" \
            --jq '.[] | "\(.id) \(.sha)"')

          PREV_SHA=""
          while IFS= read -r line; do
            id=$(echo "$line" | awk '{print $1}')
            sha=$(echo "$line" | awk '{print $2}')
            [ -z "$id" ] && continue
            [ "$sha" = "$CURRENT_SHA" ] && continue
            # GitHub Pages adds an "inactive" status to prior deployments when a
            # new one becomes active, so checking only .[0] misses deploys that
            # did succeed. Look for any "success" status in the history instead.
            success_count=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '[.[] | select(.state == "success")] | length')
            if [ "$success_count" -gt 0 ]; then
              PREV_SHA="$sha"
              break
            fi
          done <<< "$deployments"

          echo "Previous successful deploy SHA: $PREV_SHA"
          echo "sha=$PREV_SHA" >> $GITHUB_OUTPUT

      - name: Detect changes since last successful deploy
        id: changes
        run: |
          PREV_SHA="${{ steps.prev.outputs.sha }}"
          CURRENT_SHA="${{ github.event.deployment.sha }}"

          if [ -z "$PREV_SHA" ]; then
            echo "No previous successful deploy found; purging the whole zone."
            echo "sitewide=true" >> $GITHUB_OUTPUT
            echo "urls=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Make sure both SHAs are present locally
          git fetch --no-tags --depth=100 origin "$PREV_SHA" "$CURRENT_SHA" 2>/dev/null || true

          echo "Files changed between $PREV_SHA and $CURRENT_SHA:"
          git diff --name-only "$PREV_SHA" "$CURRENT_SHA" || true

          # Cambios que afectan al HTML de TODAS las páginas: assets enlazados
          # desde head.html (css/, js/, fonts/), layouts, includes, datos y
          # config. Purgar URL a URL no sirve aquí (son 160+ páginas), así que
          # se purga la zona entera de una sola llamada.
          #
          # fonts/ está en la lista por un motivo MÁS fuerte que css/ y js/:
          # esos dos se sirven con ?v={{ site.time }}, así que un fichero nuevo
          # estrena URL y nunca puede llegar cacheado. Las fuentes, en cambio,
          # se piden por URL desnuda (/fonts/lora.woff2, tanto desde el
          # @font-face como desde el rel="preload" de head.html). Si algún día
          # se sustituye una fuente conservando el nombre, sin purgar aquí
          # Cloudflare seguiría sirviendo los bytes viejos indefinidamente.
          if git diff --name-only "$PREV_SHA" "$CURRENT_SHA" -- css/ js/ fonts/ _layouts/ _includes/ _data/ _config.yml | grep -q .; then
            echo "Site-wide change detected; will purge everything."
            echo "sitewide=true" >> $GITHUB_OUTPUT
            echo "urls=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "sitewide=false" >> $GITHUB_OUTPUT

          # Para cada post y cada página suelta añadida/modificada/borrada/renombrada,
          # se calcula su URL en PREV_SHA y en CURRENT_SHA, de modo que se purgue la
          # URL antigua, la nueva, o ambas.
          python3 - "$PREV_SHA" "$CURRENT_SHA" > urls.json <<'PY'
          import json, os, re, subprocess, sys

          prev_sha, curr_sha = sys.argv[1], sys.argv[2]
          SITE = "https://www.aunitz.net"

          def is_content(path):
              """Posts, y páginas sueltas HTML en la raíz del repo."""
              if path.startswith("_posts/"):
                  return True
              return "/" not in path and path.endswith(".html")

          def changed_files():
              out = subprocess.run(
                  ["git", "diff", "--name-status", "-M", prev_sha, curr_sha],
                  capture_output=True, text=True, check=True,
              ).stdout
              for line in out.splitlines():
                  parts = line.split("\t")
                  status = parts[0]
                  if status.startswith("R") and len(parts) >= 3:
                      yield (prev_sha, parts[1])
                      yield (curr_sha, parts[2])
                  elif status == "A" and len(parts) >= 2:
                      yield (curr_sha, parts[1])
                  elif status == "D" and len(parts) >= 2:
                      yield (prev_sha, parts[1])
                  elif len(parts) >= 2:
                      # M, T, C, etc.
                      yield (prev_sha, parts[1])
                      yield (curr_sha, parts[-1])

          def show(sha, path):
              r = subprocess.run(["git", "show", f"{sha}:{path}"], capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None

          def parse_frontmatter(text):
              if not text.startswith("---"):
                  return {}
              end = text.find("\n---", 3)
              if end == -1:
                  return {}
              fm = {}
              for line in text[3:end].splitlines():
                  m = re.match(r'^([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.*?)\s*$', line)
                  if m:
                      fm[m.group(1)] = m.group(2).strip().strip('"').strip("'")
              return fm

          def url_for(sha, path):
              text = show(sha, path)
              if text is None:
                  return None
              fm = parse_frontmatter(text)
              permalink = fm.get("permalink")
              if not permalink:
                  base = os.path.basename(path)
                  slug = re.sub(r'^\d{4}-\d{2}-\d{2}-', '', base)
                  slug = re.sub(r'\.(markdown|md|html)$', '', slug, flags=re.IGNORECASE)
                  # index.html es la portada, ya incluida en las URLs estáticas
                  permalink = "/" if slug == "index" else f"/{slug}/"
              if not permalink.startswith("/"):
                  permalink = "/" + permalink
              return SITE + permalink

          def pagination_urls():
              """URLs de las páginas del paginador de la portada.

              jekyll-paginate reparte TODOS los ficheros de _posts/ (el filtro
              hide_from_home actúa al pintar, no al paginar), así que un alta o
              una baja desplaza los posts entre páginas y las deja obsoletas
              todas. Se purgan también al modificar un post, porque su título y
              subtítulo se pintan en el listado. La página 1 es "/", ya incluida
              entre las URLs estáticas.
              """
              config = show(curr_sha, "_config.yml") or ""
              m = re.search(r'^paginate:\s*(\d+)', config, flags=re.MULTILINE)
              per_page = int(m.group(1)) if m else 5

              tree = subprocess.run(
                  ["git", "ls-tree", "-r", "--name-only", curr_sha, "_posts/"],
                  capture_output=True, text=True, check=True,
              ).stdout
              total = sum(
                  1 for p in tree.splitlines()
                  if re.match(r'^_posts/\d{4}-\d{2}-\d{2}-.+\.(markdown|md|html)$', p, flags=re.IGNORECASE)
              )

              total_pages = -(-total // per_page)  # ceil
              return [f"{SITE}/page{n}/" for n in range(2, total_pages + 1)]

          urls = set()
          posts_changed = False
          for sha, path in changed_files():
              if not is_content(path):
                  continue
              if path.startswith("_posts/"):
                  posts_changed = True
              u = url_for(sha, path)
              if u:
                  urls.add(u)

          if posts_changed:
              urls.update(pagination_urls())

          print(json.dumps(sorted(urls)))
          PY

          URLS=$(cat urls.json)
          echo "Affected URLs: $URLS"
          echo "urls=$URLS" >> $GITHUB_OUTPUT

      - name: Purge whole Cloudflare zone
        if: steps.changes.outputs.sitewide == 'true'
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything": true}'

      - name: Purge Cloudflare cache for affected URLs
        if: steps.changes.outputs.sitewide == 'false' && steps.changes.outputs.urls != '[]'
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTENT_URLS: ${{ steps.changes.outputs.urls }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request

          zone = os.environ["CF_ZONE_ID"]
          token = os.environ["CF_TOKEN"]
          site = "https://www.aunitz.net"

          static = [
              f"{site}/",
              f"{site}/tags/",
              f"{site}/dashboard/",
              f"{site}/feed.xml",
              f"{site}/sitemap.xml",
          ]
          content_urls = json.loads(os.environ.get("CONTENT_URLS") or "[]")

          # Dedupe while preserving order: static first, then content.
          seen = set()
          all_urls = []
          for u in static + content_urls:
              if u not in seen:
                  seen.add(u)
                  all_urls.append(u)

          print(f"Purging {len(all_urls)} URL(s):")
          for u in all_urls:
              print(f"  {u}")

          # Cloudflare's purge-by-URL endpoint accepts at most 30 files per call.
          for i in range(0, len(all_urls), 30):
              batch = all_urls[i:i + 30]
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache",
                  data=json.dumps({"files": batch}).encode(),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as r:
                  print(f"Batch {i // 30 + 1}: {r.read().decode()}")
          PY
